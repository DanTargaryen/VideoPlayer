name: monolith-ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: monolith-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build, and unit/API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local CI gate
        run: npm run test:ci

  api-integration:
    name: All public Controller API routes
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: video_player_api_test
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/video_player_api_test
      INTEGRATION_DATABASE_URL: mysql://root@127.0.0.1:3306/video_player_api_test
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: ${{ github.workspace }}/.runtime-api-storage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated API database
        run: |
          npm --workspace backend run prisma:generate
          for attempt in $(seq 1 30); do
            if npm --workspace backend run db:migrate; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"
          exit 1

      - name: Exercise every public Controller route
        run: npm run test:api

      - name: Upload API route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-route-evidence
          path: |
            test-results/integration-api-latest.json
            test-results/public-api-route-coverage.json
          if-no-files-found: error

  public-e2e:
    name: Public browser smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: video_player_test
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/video_player_test
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: ${{ github.workspace }}/.runtime-storage
      VITE_API_PROXY_TARGET: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma schema
        run: |
          npm --workspace backend run prisma:generate
          for attempt in $(seq 1 30); do
            if npm --workspace backend run db:migrate; then
              seed_confirmation="$(openssl rand -hex 18)"
              SEED_GUARD_PASSWORD="$seed_confirmation" \
                SEED_GUARD_CONFIRM="$seed_confirmation" \
                npm --workspace backend run db:seed
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"
          exit 1

      - name: Start backend and frontend
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export ADMIN_SECRET="$(openssl rand -hex 16)"
          npm run dev:backend > backend-e2e.log 2>&1 &
          echo $! > backend-e2e.pid
          npm run dev:frontend > frontend-e2e.log 2>&1 &
          echo $! > frontend-e2e.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become ready"
          exit 1

      - name: Run Playwright public smoke
        run: npm run test:e2e:public

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-e2e-evidence
          path: |
            backend-e2e.log
            frontend-e2e.log
            playwright-report
            test-results
          if-no-files-found: warn

  deploy-kind:
    name: Build all Git SHA images and deploy monolith plus microservices to isolated Kind
    runs-on: ubuntu-latest
    needs:
      - quality
      - api-integration
      - public-e2e
    env:
      IMAGE_TAG: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_id }}
      KIND_CLUSTER_NAME: video-player-${{ github.run_id }}-${{ github.run_attempt }}
      K8S_NAMESPACE: video-player
      CI_RUN_SUBDIR: actions-${{ github.run_id }}-${{ github.run_attempt }}
      CI_EVIDENCE_SUBDIR: actions-${{ github.run_id }}-${{ github.run_attempt }}
      CI_RUN_DIR: ${{ github.workspace }}/.codex-run/actions-${{ github.run_id }}-${{ github.run_attempt }}
      CI_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence/actions-${{ github.run_id }}-${{ github.run_attempt }}
      CI_RUNTIME_ENV_FILE: ${{ github.workspace }}/.codex-run/actions-${{ github.run_id }}-${{ github.run_attempt }}/runtime.env
      PRACTICE_ENV_FILE: ${{ github.workspace }}/.codex-run/actions-${{ github.run_id }}-${{ github.run_attempt }}/practice.env
      DEPLOYMENT_EVIDENCE_DIR: ${{ github.workspace }}/.runtime-ci/deployment-evidence
      KIND_RELEASE_LOCAL_IMAGES_AFTER_IMPORT: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Kind
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind-linux-amd64"
          printf '%s  %s\n' \
            '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54' \
            "$RUNNER_TEMP/kind-linux-amd64" | sha256sum --check -
          sudo install -m 0755 "$RUNNER_TEMP/kind-linux-amd64" /usr/local/bin/kind
          kind version
          kubectl version --client

      - name: Prepare isolated full-stack inputs
        run: |
          docker pull mysql:8.0
          bash scripts/ci-bootstrap.sh

      - name: Build monolith, service, Gateway, and migration Git SHA images
        run: bash scripts/ci-build-images.sh

      - name: Run services-mode UC01-UC06 browser regression
        env:
          MICROSERVICE_COMPOSE_PROJECT_NAME: video-player-ms00-actions-${{ github.run_id }}-${{ github.run_attempt }}
          MICROSERVICE_COMPOSE_SKIP_BUILD: "true"
          MICROSERVICE_COMPOSE_SCOPE: browser
          GIT_SHA: ${{ github.sha }}
        run: |
          export FFMPEG_PATH="$(node -e "process.stdout.write(require('ffmpeg-static'))")"
          test -f "$FFMPEG_PATH"
          chmod +x "$FFMPEG_PATH"
          "$FFMPEG_PATH" -version > /dev/null
          bash scripts/compose-microservices-smoke.sh

      - name: Deploy all Git SHA images to isolated Kind
        run: bash scripts/ci-k8s-deploy.sh

      - name: Verify monolith and microservice Kubernetes deployments
        run: bash scripts/ci-k8s-health-check.sh

      - name: Collect deployment evidence
        if: always()
        run: |
          mkdir -p "$DEPLOYMENT_EVIDENCE_DIR"
          if kind get clusters 2>/dev/null | grep -Fxq "$KIND_CLUSTER_NAME"; then
            kubectl config use-context "kind-$KIND_CLUSTER_NAME" >/dev/null
            kubectl get nodes -o wide > "$DEPLOYMENT_EVIDENCE_DIR/nodes.txt" || true
            kubectl -n "$K8S_NAMESPACE" get pods,services,pvc -o wide \
              > "$DEPLOYMENT_EVIDENCE_DIR/workloads.txt" || true
            kubectl -n "$K8S_NAMESPACE" get pods \
              -o custom-columns='NAME:.metadata.name,READY:.status.containerStatuses[*].ready,IMAGE:.spec.containers[*].image,RESTARTS:.status.containerStatuses[*].restartCount' \
              > "$DEPLOYMENT_EVIDENCE_DIR/images.txt" || true
            kubectl -n "$K8S_NAMESPACE" logs job/db-migrate --all-containers=true --tail=200 \
              > "$DEPLOYMENT_EVIDENCE_DIR/migration.log" 2>&1 || true
            for job_name in identity-migrate content-migrate live-reward-migrate governance-migrate; do
              if kubectl -n "$K8S_NAMESPACE" get "job/$job_name" >/dev/null 2>&1; then
                kubectl -n "$K8S_NAMESPACE" logs "job/$job_name" --all-containers=true --tail=200 \
                  > "$DEPLOYMENT_EVIDENCE_DIR/$job_name.log" 2>&1 || true
              elif [[ -f "$CI_EVIDENCE_DIR/k8s-migrations/$job_name.log" ]]; then
                cp "$CI_EVIDENCE_DIR/k8s-migrations/$job_name.log" \
                  "$DEPLOYMENT_EVIDENCE_DIR/$job_name.log"
              fi
            done
            kubectl -n "$K8S_NAMESPACE" get events --sort-by=.lastTimestamp \
              > "$DEPLOYMENT_EVIDENCE_DIR/events.txt" || true
            printf 'evidence=collected\ncluster=%s\nnamespace=%s\nimage_tag=%s\n' \
              "$KIND_CLUSTER_NAME" "$K8S_NAMESPACE" "$IMAGE_TAG" \
              > "$DEPLOYMENT_EVIDENCE_DIR/status.properties"
          else
            printf 'evidence=cluster_not_created\ncluster=%s\n' "$KIND_CLUSTER_NAME" \
              > "$DEPLOYMENT_EVIDENCE_DIR/status.properties"
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-kind-deployment-evidence
          path: |
            ${{ github.workspace }}/.runtime-ci/deployment-evidence
            ${{ github.workspace }}/ci-evidence/actions-${{ github.run_id }}-${{ github.run_attempt }}
            playwright-report
            test-results
          if-no-files-found: error

      - name: Clean up isolated deployment
        if: always()
        run: |
          kind delete cluster --name "$KIND_CLUSTER_NAME" || true
          unlink "$PRACTICE_ENV_FILE" 2>/dev/null || true
