name: monolith-ci

on:
  workflow_dispatch:

concurrency:
  group: monolith-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build, and unit/API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local CI gate
        run: npm run test:ci

  public-e2e:
    name: Public browser smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: video_player_test
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/video_player_test
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: ${{ github.workspace }}/.runtime-storage
      VITE_API_PROXY_TARGET: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma schema
        run: |
          npm --workspace backend run prisma:generate
          for attempt in $(seq 1 30); do
            if npm --workspace backend run db:migrate; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"
          exit 1

      - name: Start backend and frontend
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export ADMIN_SECRET="$(openssl rand -hex 16)"
          npm run dev:backend > backend-e2e.log 2>&1 &
          echo $! > backend-e2e.pid
          npm run dev:frontend > frontend-e2e.log 2>&1 &
          echo $! > frontend-e2e.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become ready"
          exit 1

      - name: Run Playwright public smoke
        run: npm run test:e2e

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-e2e-evidence
          path: |
            backend-e2e.log
            frontend-e2e.log
            playwright-report
            test-results
          if-no-files-found: warn

  images:
    name: Build versioned monolith images
    runs-on: ubuntu-latest
    needs:
      - quality
      - public-e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag video-player/backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag video-player/frontend:${{ github.sha }} .
