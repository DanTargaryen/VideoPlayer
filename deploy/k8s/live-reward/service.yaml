apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-reward
  namespace: video-player-live-reward
  labels:
    app.kubernetes.io/name: live-reward
    app.kubernetes.io/part-of: video-player-live-reward
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: live-reward
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-reward
        app.kubernetes.io/part-of: video-player-live-reward
    spec:
      containers:
        - name: live-reward
          image: video-player/live-reward:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: GIT_SHA
              valueFrom:
                configMapKeyRef:
                  name: live-reward-config
                  key: GIT_SHA
            - name: LIVE_REWARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: live-reward-secrets
                  key: database-url
            - name: SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: live-reward-secrets
                  key: service-jwt-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: live-reward
  namespace: video-player-live-reward
  labels:
    app.kubernetes.io/name: live-reward
    app.kubernetes.io/part-of: video-player-live-reward
spec:
  selector:
    app.kubernetes.io/name: live-reward
  ports:
    - name: http
      port: 3000
      targetPort: http
