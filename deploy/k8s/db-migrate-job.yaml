apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: video-player
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: video-player
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: video-player
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mysql
          image: video-player/backend:local
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const net = require('node:net');
              const deadline = Date.now() + 120000;
              const connect = () => {
                const socket = net.connect(3306, 'mysql');
                socket.on('connect', () => { socket.end(); process.exit(0); });
                socket.on('error', () => {
                  socket.destroy();
                  if (Date.now() > deadline) process.exit(1);
                  setTimeout(connect, 2000);
                });
              };
              connect();
      containers:
        - name: migrate
          image: video-player/backend:local
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - --workspace
            - backend
            - run
            - db:migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: videoplayer-secrets
                  key: database-url
