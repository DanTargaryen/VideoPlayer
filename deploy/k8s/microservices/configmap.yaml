apiVersion: v1
kind: ConfigMap
metadata:
  name: videoplayer-microservice-config
  namespace: video-player
data:
  GIT_SHA: local
  GATEWAY_ROUTE_MODE: monolith
  GATEWAY_READ_CUTOVER: identity-community,content-media
  GATEWAY_WRITE_CUTOVER: ""
  MONOLITH_BASE_URL: http://backend:3000
  IDENTITY_SERVICE_URL: http://identity-community:3000
  CONTENT_SERVICE_URL: http://content-media:3000
  LIVE_SERVICE_URL: http://live-reward:3000
  GOVERNANCE_SERVICE_URL: http://governance-ai:3000
  MINIO_ENDPOINT: content-minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: videoplayer-content
  GATEWAY_MONOLITH_FALLBACK: "true"
  GATEWAY_UPSTREAM_TIMEOUT_MS: "2000"
