apiVersion: v1
kind: Secret
metadata:
  name: videoplayer-microservice-secrets
  namespace: video-player
type: Opaque
stringData:
  service-jwt-secret: replace-with-at-least-32-random-characters
  identity-database-url: mysql://identity_app:replace-with-url-encoded-password@mysql:3306/video_player_identity
  identity-admin-secret: replace-with-at-least-32-random-characters
  content-database-url: mysql://content_media:replace-with-random-password@mysql:3306/content_media
  live-reward-database-url: mysql://live_reward:replace-with-random-password@mysql:3306/video_player_live_reward_test
  governance-database-url: mysql://governance_app:replace-with-random-password@mysql:3306/video_player_governance_test
