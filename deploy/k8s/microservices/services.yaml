apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-community
  namespace: video-player
  labels:
    app.kubernetes.io/name: identity-community
    app.kubernetes.io/part-of: video-player-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-community
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-community
        app.kubernetes.io/part-of: video-player-microservices
    spec:
      containers:
        - name: identity-community
          image: video-player/identity-community:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: GIT_SHA
              valueFrom:
                configMapKeyRef:
                  name: videoplayer-microservice-config
                  key: GIT_SHA
            - name: SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: videoplayer-microservice-secrets
                  key: service-jwt-secret
            - name: IDENTITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: videoplayer-microservice-secrets
                  key: identity-database-url
            - name: IDENTITY_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: videoplayer-microservice-secrets
                  key: identity-admin-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-community
  namespace: video-player
  labels:
    app.kubernetes.io/name: identity-community
    app.kubernetes.io/part-of: video-player-microservices
spec:
  selector:
    app.kubernetes.io/name: identity-community
  ports:
    - name: http
      port: 3000
      targetPort: http
