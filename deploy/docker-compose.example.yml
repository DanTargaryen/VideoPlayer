services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_player}
    ports:
      - '3306:3306'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'

  srs:
    image: docker.m.daocloud.io/ossrs/srs:5
    environment:
      CANDIDATE: 127.0.0.1
    ports:
      - '1935:1935'
      - '8080:8080'
      - '1985:1985'
      - '8000:8000/udp'
