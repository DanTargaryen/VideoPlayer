apiVersion: v1
kind: Service
metadata:
  name: content-minio
  namespace: video-player
  labels:
    app.kubernetes.io/name: content-minio
    app.kubernetes.io/part-of: video-player-microservices
spec:
  selector:
    app.kubernetes.io/name: content-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: content-minio
  namespace: video-player
  labels:
    app.kubernetes.io/name: content-minio
    app.kubernetes.io/part-of: video-player-microservices
spec:
  serviceName: content-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: content-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content-minio
        app.kubernetes.io/part-of: video-player-microservices
    spec:
      containers:
        - name: minio
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: videoplayer-microservice-secrets
                  key: minio-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: videoplayer-microservice-secrets
                  key: minio-secret-key
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
