apiVersion: batch/v1
kind: Job
metadata:
  name: governance-migrate
  namespace: video-player
  labels:
    app.kubernetes.io/name: governance-migrate
    app.kubernetes.io/part-of: video-player-microservices
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governance-migrate
        app.kubernetes.io/part-of: video-player-microservices
    spec:
      restartPolicy: Never
      containers:
        - name: governance-migrate
          image: video-player/governance-ai-migration:local
          imagePullPolicy: IfNotPresent
          env:
            - name: GOVERNANCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: videoplayer-microservice-secrets
                  key: governance-database-url
          command:
            - npm
            - --workspace
            - "@videoplayer/governance-ai"
            - run
            - db:migrate
