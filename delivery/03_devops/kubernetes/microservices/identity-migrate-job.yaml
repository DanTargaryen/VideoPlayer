apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrate
  namespace: video-player
  labels:
    app.kubernetes.io/name: identity-migrate
    app.kubernetes.io/part-of: video-player-microservices
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-migrate
        app.kubernetes.io/part-of: video-player-microservices
    spec:
      restartPolicy: Never
      containers:
        - name: identity-migrate
          image: video-player/identity-community-migration:local
          imagePullPolicy: IfNotPresent
          env:
            - name: IDENTITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: videoplayer-microservice-secrets
                  key: identity-database-url
          command:
            - npm
            - --workspace
            - "@videoplayer/identity-community"
            - run
            - db:migrate
