apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: video-player
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: video-player
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: video-player
    spec:
      containers:
        - name: backend
          image: video-player/backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: videoplayer-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: videoplayer-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: videoplayer-secrets
                  key: jwt-secret
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: videoplayer-secrets
                  key: admin-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: local-storage
              mountPath: /app/storage
      volumes:
        - name: local-storage
          emptyDir: {}
